name: Check Dependencies
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read-only dependency and security report
        run: node bin/packmate.js --ci --json > packmate-report.json
      - name: Upload report including incomplete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packmate-report
          path: packmate-report.json
